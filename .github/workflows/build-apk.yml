
name: Build WA Contact Collector APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download source dari GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. Informasi Flutter
      - name: Check Flutter version
        run: flutter --version

      # 5. Backup konfigurasi Android lama
      #    dan buat ulang struktur Android resmi
      - name: Regenerate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================="
          echo "BACKUP ANDROID LAMA"
          echo "=================================="

          if [ -d android ]; then
            mv android "$RUNNER_TEMP/android_legacy"
          fi

          echo "=================================="
          echo "GENERATE ANDROID BARU"
          echo "=================================="

          flutter create \
            --template app \
            --platforms android \
            --project-name wa_contact_collector \
            --org com.getnomor \
            .

          echo "=================================="
          echo "RESTORE KODE KOTLIN"
          echo "=================================="

          KOTLIN_PATH="app/src/main/kotlin/com/getnomor/wa_contact_collector"

          if [ -d "$RUNNER_TEMP/android_legacy/$KOTLIN_PATH" ]; then
            mkdir -p "android/$KOTLIN_PATH"

            cp -a \
              "$RUNNER_TEMP/android_legacy/$KOTLIN_PATH/." \
              "android/$KOTLIN_PATH/"
          fi

          echo "=================================="
          echo "RESTORE ANDROID MANIFEST"
          echo "=================================="

          OLD_MANIFEST="$RUNNER_TEMP/android_legacy/app/src/main/AndroidManifest.xml"

          if [ -f "$OLD_MANIFEST" ]; then
            cp "$OLD_MANIFEST" \
              android/app/src/main/AndroidManifest.xml
          fi

          echo "=================================="
          echo "VERIFIKASI ANDROID"
          echo "=================================="

          ls -la android
          ls -la android/app

          echo "Android project generated."

      # 6. Install dependency Flutter
      - name: Flutter pub get
        run: flutter pub get

      # 7. Hapus test bawaan yang tidak cocok
      #    dengan source aplikasi getnomor
      - name: Remove incompatible widget test
        shell: bash
        run: |
          rm -f test/widget_test.dart
          echo "Incompatible widget test removed."

      # 8. Analisis source Flutter
      #    Info deprecation tidak menggagalkan build
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      # 9. Build APK debug
      - name: Build APK debug
        run: flutter build apk --debug

      # 10. Verifikasi APK
      - name: Verify APK
        shell: bash
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo "=================================="
          echo "APK BERHASIL DIBUAT"
          echo "=================================="

          ls -lh "$APK_PATH"

      # 11. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wa-contact-collector-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
