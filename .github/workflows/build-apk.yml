
name: Build WA Contact Collector APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Rebuild Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Backup Android lama"
          mv android "$RUNNER_TEMP/android_legacy"

          echo "Generate Android dari Flutter stable"
          flutter create \
            --platforms=android \
            --project-name wa_contact_collector \
            --org com.getnomor \
            .

          echo "Restore kode Kotlin custom"
          KOTLIN_PATH="app/src/main/kotlin/com/getnomor/wa_contact_collector"

          mkdir -p "android/$KOTLIN_PATH"

          cp -a \
            "$RUNNER_TEMP/android_legacy/$KOTLIN_PATH/." \
            "android/$KOTLIN_PATH/"

          echo "Restore AndroidManifest"
          cp \
            "$RUNNER_TEMP/android_legacy/app/src/main/AndroidManifest.xml" \
            android/app/src/main/AndroidManifest.xml

          echo "Periksa hasil scaffold"
          ls -la android
          ls -la "android/$KOTLIN_PATH"

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wa-contact-collector-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
