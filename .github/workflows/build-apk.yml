
name: Build WA Contact Collector APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download source repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 4. Check Flutter version
      - name: Check Flutter version
        run: flutter --version

      # 5. Generate struktur Android resmi
      - name: Regenerate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================="
          echo "BACKUP ANDROID LAMA"
          echo "=================================="

          if [ -d android ]; then
            mv android "$RUNNER_TEMP/android_legacy"
          fi

          echo "=================================="
          echo "GENERATE ANDROID FLUTTER BARU"
          echo "=================================="

          flutter create \
            --template app \
            --platforms android \
            --project-name wa_contact_collector \
            --org com.getnomor \
            .

          echo "=================================="
          echo "RESTORE KODE KOTLIN"
          echo "=================================="

          KOTLIN_PATH="app/src/main/kotlin/com/getnomor/wa_contact_collector"

          if [ -d "$RUNNER_TEMP/android_legacy/$KOTLIN_PATH" ]; then
            mkdir -p "android/$KOTLIN_PATH"

            cp -a \
              "$RUNNER_TEMP/android_legacy/$KOTLIN_PATH/." \
              "android/$KOTLIN_PATH/"
          fi

          echo "=================================="
          echo "RESTORE ANDROID MANIFEST"
          echo "=================================="

          OLD_MANIFEST="$RUNNER_TEMP/android_legacy/app/src/main/AndroidManifest.xml"

          if [ -f "$OLD_MANIFEST" ]; then
            cp "$OLD_MANIFEST" \
              android/app/src/main/AndroidManifest.xml
          fi

          echo "=================================="
          echo "VERIFY ANDROID PROJECT"
          echo "=================================="

          ls -la android
          ls -la android/app

      # 6. Install dependencies
      - name: Flutter pub get
        run: flutter pub get

      # 7. Remove incompatible default widget test
      - name: Remove incompatible widget test
        shell: bash
        run: |
          rm -f test/widget_test.dart

      # 8. Analyze Flutter source
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      # 9. Build APK debug
      - name: Build APK debug
        run: flutter build apk --debug

      # 10. Verify and rename APK
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK_SOURCE="build/app/outputs/flutter-apk/app-debug.apk"
          APK_RELEASE="WA-Contact-Collector.apk"

          if [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi

          cp "$APK_SOURCE" "$APK_RELEASE"

          echo "=================================="
          echo "APK BERHASIL DIBUAT"
          echo "=================================="

          ls -lh "$APK_RELEASE"

      # 11. Upload artifact sebagai cadangan
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wa-contact-collector-debug-apk
          path: WA-Contact-Collector.apk
          if-no-files-found: error
          retention-days: 7

      # 12. Publish APK ke GitHub Releases
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: WA Contact Collector Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            WA Contact Collector - Android APK

            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}

            Fitur aplikasi:
            - Deteksi nomor dari notifikasi WhatsApp
            - Mendukung WhatsApp Business
            - Daftar nomor yang terdeteksi
            - Simpan nomor ke kontak Android
            - Pencegahan duplikasi nomor
            - Penyimpanan riwayat lokal

            CATATAN:
            Ini adalah APK debug untuk pengujian.
            Deteksi hanya bekerja pada notifikasi yang
            menampilkan nomor telepon dan diizinkan Android.

            Download file WA-Contact-Collector.apk
            melalui bagian Assets di bawah.
          draft: false
          prerelease: false
          make_latest: true
          files: WA-Contact-Collector.apk
          fail_on_unmatched_files: true
